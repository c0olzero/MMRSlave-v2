<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" width="100%" height="100%" class="max-h-[370px] ">
    <!-- MMRSlave Primary Stacked Lockup (Upright Square + BL-to-TR Diagonal + Clean MMR) -->
    <g transform="translate(140, 10)">
        
            <defs>
                <!-- Dire Crimson Core Gradient (Bottom-Left to Top-Right) -->
                <linearGradient id="direGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#9E1B15"/>
                    <stop offset="50%" stop-color="#E62E25"/>
                    <stop offset="100%" stop-color="#FF3B30"/>
                </linearGradient>

                <!-- Dark Obsidian Citadel Fill -->
                <linearGradient id="obsidianGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#181820"/>
                    <stop offset="100%" stop-color="#0A0A0C"/>
                </linearGradient>

                <!-- Stark White / Ash Metallic Bevel -->
                <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#FFFFFF"/>
                    <stop offset="100%" stop-color="#D1D1D6"/>
                </linearGradient>

                <!-- Dire Ambient Glow Filter -->
                <filter id="direGlow" x="-25%" y="-25%" width="150%" height="150%">
                    <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#E62E25" flood-opacity="0.6"/>
                </filter>
            </defs>

            <!-- Ambient Backplate Glow (FX Layer) -->
            <g class="fx-layer">
                <polygon points="34,20 206,20 220,34 220,206 206,220 34,220 20,206 20,34" fill="none" stroke="#E62E25" stroke-width="2.5" opacity="0.4" filter="url(#direGlow)"/>
            </g>

            <!-- 1. UPRIGHT SQUARE Fortified Dota 2 Monolith Base Frame -->
            <polygon points="36,22 204,22 218,36 218,204 204,218 36,218 22,204 22,36" fill="url(#obsidianGrad)" stroke="#2A2A35" stroke-width="3.5"/>
            <!-- Inner Fortified Upright Square Border -->
            <polygon points="42,32 198,32 208,42 208,198 198,208 42,208 32,198 32,42" fill="#0A0A0C" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.85"/>
            <!-- Corner Rivet Notches -->
            <polygon points="32,56 40,48 40,76 32,76" fill="#E62E25"/>
            <polygon points="208,184 200,192 200,164 208,164" fill="#E62E25"/>

            <!-- 2. Chiseled Ancient Monolith Shards (Top-Left & Bottom-Right Territories) -->
            <!-- Top-Left High-Ground Monolith Block -->
            <g>
                <polygon points="46,46 164,46 132,78 96,86 78,132 46,164" fill="url(#steelGrad)"/>
                <!-- 3D Inner Facet Bevel -->
                <polygon points="164,46 132,78 96,86 78,132 46,164 62,118 84,74" fill="#D1D1D6"/>
                <polygon points="56,56 126,56 106,72 72,106 56,126" fill="#FFFFFF"/>
            </g>

            <!-- Bottom-Right High-Ground Monolith Block -->
            <g>
                <polygon points="194,194 76,194 108,162 144,154 162,108 194,76" fill="url(#steelGrad)"/>
                <!-- 3D Inner Facet Bevel -->
                <polygon points="76,194 108,162 144,154 162,108 194,76 178,122 156,166" fill="#D1D1D6"/>
                <polygon points="184,184 114,184 134,168 168,134 184,114" fill="#FFFFFF"/>
            </g>

            <!-- 3. Shattered MMR Trench Shackles (Snapping at the Bottom-Left Origin & Flanks) -->
            <!-- Left / Bottom-Left Broken Shackle Link -->
            <g>
                <path d="M4,160 L38,142 L50,156 L24,172 L34,186 L60,170 L70,184 L30,210 L6,188 Z" fill="url(#steelGrad)" stroke="#0A0A0C" stroke-width="3"/>
                <polygon points="38,142 50,156 42,161 31,147" fill="#E62E25"/>
                <polygon points="60,170 70,184 61,190 52,175" fill="#E62E25"/>
            </g>
            <!-- Bottom / Bottom-Right Broken Shackle Link -->
            <g>
                <path d="M160,236 L142,202 L156,190 L172,216 L186,206 L170,180 L184,170 L210,210 L188,234 Z" fill="url(#steelGrad)" stroke="#0A0A0C" stroke-width="3"/>
                <polygon points="142,202 156,190 161,198 147,209" fill="#E62E25"/>
                <polygon points="170,180 184,170 190,179 175,188" fill="#E62E25"/>
            </g>

            <!-- 4. BOTTOM-LEFT TO TOP-RIGHT Blazing Crimson Diagonal Slash -->
            <g class="fx-layer" filter="url(#direGlow)">
                <polygon points="12,206 206,12 228,34 34,228" fill="#E62E25" opacity="0.6"/>
            </g>
            <!-- Main Crimson Diagonal Blade (Bottom-Left [12,208] -> Top-Right [208,12]) -->
            <polygon points="10,208 208,10 230,32 32,230" fill="url(#direGrad)" stroke="#0A0A0C" stroke-width="2"/>
            <!-- Hot Core Energy Line along the 45° Bottom-Left to Top-Right Diagonal -->
            <polygon points="24,210 210,24 216,30 30,216" fill="#FF3B30"/>
            <polygon points="38,200 200,38 203,41 41,203" fill="#FFFFFF" opacity="0.85"/>

            <!-- 5. Top-Right Apex Immortal Ascension Chevron / Arrowhead Crest -->
            <g>
                <!-- Outer Crimson Ascension Wing Capping Top-Right Corner -->
                <polygon points="144,8 232,8 232,96 208,82 208,32 158,32" fill="url(#direGrad)" stroke="#0A0A0C" stroke-width="2.5"/>
                <polygon points="154,12 228,12 228,86 218,80 218,22 160,22" fill="#FF3B30"/>
                <!-- Inner Stark White Rank-Up Chevron Pointing into Top-Right Apex -->
                <polygon points="172,22 218,22 218,68 202,58 202,38 182,38" fill="#FFFFFF" stroke="#0A0A0C" stroke-width="2"/>
            </g>

            <!-- Flying Crimson Shatter Shards at Bottom-Left Trench Break -->
            <polygon points="6,130 28,122 20,144" fill="#FF3B30"/>
            <polygon points="106,234 116,212 94,220" fill="#FF3B30"/>
            <polygon points="8,224 26,208 16,232" fill="#FFFFFF"/>

            <!-- Sacred Geometry Construction Grid Overlay (Upright Square + BL-to-TR Diagonal) -->
            <g class="guide-layer" stroke="#FF3B30" stroke-width="0.9" stroke-dasharray="4 4" fill="none">
                <rect x="22" y="22" width="196" height="196"/>
                <rect x="32" y="32" width="176" height="176"/>
                <!-- Bottom-Left to Top-Right Primary Trajectory Axis -->
                <line x1="0" y1="240" x2="240" y2="0" stroke="#FFFFFF" stroke-width="1.2"/>
                <line x1="0" y1="120" x2="240" y2="120"/>
                <line x1="120" y1="0" x2="120" y2="240"/>
                <circle cx="120" cy="120" r="98"/>
            </g>
            
    </g>
    
            <g transform="translate(76, 256) scale(1)">
                <!-- CLEAN, UN-SLASHED MONUMENTAL "MMR" CUSTOM VECTOR PATHS -->
                <g fill="#FFFFFF">
                    <!-- First 'M' (Upright, Heavy Chiseled Esports Block: x: 0 -> 114) -->
                    <path d="M0,110 L0,0 L32,0 L57,54 L82,0 L114,0 L114,110 L84,110 L84,44 L64,86 L50,86 L30,44 L30,110 Z"/>
                    <!-- Second 'M' (Upright, Heavy Chiseled Esports Block: x: 130 -> 244) -->
                    <path d="M130,110 L130,0 L162,0 L187,54 L212,0 L244,0 L244,110 L214,110 L214,44 L194,86 L180,86 L160,44 L160,110 Z"/>
                    <!-- Aggressive Chiseled 'R' (x: 260 -> 368) -->
                    <path d="M260,110 L260,0 L344,0 L366,22 L366,52 L344,70 L368,110 L334,110 L312,72 L290,72 L290,110 Z M290,48 L330,48 L338,40 L338,28 L330,22 L290,22 Z"/>
                </g>

                <!-- Subtle Chiseled Bottom-Right Corner Accent on 'R' Leg (No slash across letters) -->
                <polygon points="354,88 368,110 350,110" fill="#D1D1D6"/>

                <!-- Sub-bar Divider & "SLAVE" Aggressive Stencil Lockup -->
                <g transform="translate(0, 124)">
                    <!-- Fortified Upright Rectangular Frame with Chamfered Ends -->
                    <polygon points="8,6 360,6 368,14 368,50 360,58 8,58 0,50 0,14" fill="#0A0A0C" stroke="#E62E25" stroke-width="2.5"/>
                    <!-- Left & Right Solid Crimson Guard Blocks -->
                    <polygon points="0,14 8,6 24,6 24,58 8,58 0,50" fill="#E62E25"/>
                    <polygon points="344,6 360,6 368,14 368,50 360,58 344,58" fill="#E62E25"/>

                    <!-- Stenciled Vector "SLAVE" Letterforms (Pure Geometric Paths) -->
                    <g fill="#E62E25" transform="translate(46, 17)">
                        <!-- S -->
                        <path d="M0,22 L36,22 L36,15 L4,15 L4,0 L46,0 L46,7 L14,7 L14,11 L46,11 L46,30 L0,30 Z"/>
                        <!-- L -->
                        <path d="M62,0 L74,0 L74,22 L106,22 L106,30 L62,30 Z"/>
                        <!-- A (Stenciled Split Apex) -->
                        <path d="M118,30 L134,0 L150,0 L166,30 L153,30 L142,8 L131,30 Z M133,20 L151,20 L154,27 L130,27 Z"/>
                        <!-- V (Chevron Blade) -->
                        <path d="M178,0 L191,0 L200,20 L209,0 L222,0 L206,30 L194,30 Z"/>
                        <!-- E (3-Bar Stencil) -->
                        <path d="M236,0 L276,0 L276,7 L248,7 L248,30 L236,30 Z M252,11 L274,11 L274,18 L252,18 Z M252,23 L276,23 L276,30 L252,30 Z"/>
                    </g>
                </g>

                <!-- Analytics Tagline Stamp -->
                <text x="2" y="204" fill="#D1D1D6" font-family="'Chakra Petch', sans-serif" font-weight="700" font-size="13" letter-spacing="5.5" opacity="0.85">
                    BREAK THE TRENCH // DOTA 2 ANALYTICS
                </text>

                <!-- Construction Guide Overlay -->
                <g class="guide-layer" stroke="#FF3B30" stroke-width="0.75" stroke-dasharray="4 4" fill="none">
                    <rect x="0" y="0" width="368" height="110"/>
                    <rect x="0" y="130" width="368" height="52"/>
                </g>
            </g>
            
</svg>